name: Update Tennis Rankings

on:
  schedule:
    - cron: '0 9 * * 2'  # Every Tuesday at 09:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run ATP script
      run: python python/atp.py

    - name: Run WTA script
      run: python python/wta.py

    - name: Run ATP Doubles script
      run: python python/atp_doubles.py

    - name: Run WTA Doubles script
      run: python python/wta_doubles.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add atp_rankings.json wta_rankings.json atp_doubles_rankings.json wta_doubles_rankings.json
        git commit -m "Update ATP, WTA, and Doubles rankings"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
